; PHP's defaults (2M upload / 8M post) sit below the media rule (`max:5120` in
; MediaController), so bigger images died as "failed to upload" before
; validation ran. Keep these above that rule so the app decides the limit.
; 20M matches `client_max_body_size` in the staging nginx vhost.
; ponytail: only PHP-FPM/CGI serving public/index.php directly read this file.
; Herd/Valet route every request through their own server.php, and mod_php,
; FrankenPHP or Octane ignore it: set the same values in their PHP settings.
upload_max_filesize = 20M
post_max_size = 20M
